<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="14" y1="10" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="4" y="4" width="56" height="56" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1.5"/>

  <!-- Iconic Lightning Bolt / Fast Shard Glyph -->
  <path d="M36 10L16 34H31L26 54L48 28H32L36 10Z" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
